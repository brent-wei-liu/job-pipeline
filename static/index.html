<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🦀 JOB PIPELINE // TERMINAL</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700&display=swap');

  :root {
    --cyan: #00fff2;
    --magenta: #ff00ff;
    --green: #39ff14;
    --amber: #ffbf00;
    --red: #ff3333;
    --dim: #00fff233;
    --bg: #0a0a12;
    --panel: #0d0d1a;
    --border: #00fff244;
    --text: #c0c0d0;
    --scanline: rgba(0, 255, 242, 0.03);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Share Tech Mono', monospace;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* CRT scanlines */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      var(--scanline) 2px,
      var(--scanline) 4px
    );
    pointer-events: none;
    z-index: 9999;
  }

  /* CRT vignette */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.6) 100%);
    pointer-events: none;
    z-index: 9998;
  }

  /* Header */
  .header {
    padding: 20px 30px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: linear-gradient(180deg, #0d0d1a 0%, #0a0a12 100%);
  }

  .header h1 {
    font-family: 'Orbitron', sans-serif;
    font-size: 1.4em;
    color: var(--cyan);
    text-shadow: 0 0 20px var(--cyan), 0 0 40px rgba(0,255,242,0.3);
    letter-spacing: 3px;
  }

  .header .clock {
    color: var(--amber);
    text-shadow: 0 0 10px var(--amber);
    font-size: 0.9em;
  }

  /* Nav tabs */
  .nav {
    display: flex;
    gap: 0;
    padding: 0 30px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }

  .nav button {
    font-family: 'Share Tech Mono', monospace;
    background: transparent;
    border: none;
    border-bottom: 2px solid transparent;
    color: var(--text);
    padding: 12px 24px;
    cursor: pointer;
    font-size: 0.85em;
    letter-spacing: 2px;
    text-transform: uppercase;
    transition: all 0.2s;
  }

  .nav button:hover, .nav button:active {
    color: var(--cyan);
    background: rgba(0,255,242,0.05);
  }

  .nav button.active {
    color: var(--cyan);
    border-bottom-color: var(--cyan);
    text-shadow: 0 0 10px var(--cyan);
  }

  /* Main content */
  .content {
    padding: 20px 30px;
    max-width: 1400px;
    margin: 0 auto;
  }

  /* Controls bar */
  .controls {
    display: flex;
    gap: 12px;
    margin-bottom: 20px;
    flex-wrap: wrap;
    align-items: center;
  }

  .controls input, .controls select {
    font-family: 'Share Tech Mono', monospace;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--cyan);
    padding: 8px 12px;
    font-size: 0.85em;
    outline: none;
    transition: border-color 0.2s;
  }

  .controls input:focus, .controls select:focus {
    border-color: var(--cyan);
    box-shadow: 0 0 10px rgba(0,255,242,0.2);
  }

  .controls input::placeholder {
    color: #444;
  }

  /* Mobile-only "SELECT ALL" pill — desktop has it in the table thead,
     but the thead is `display:none` on mobile, so we surface it here. */
  .mobile-select-bar { display: none; }
  .mobile-select-btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    min-height: 44px;
    padding: 0 16px;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--cyan);
    font-family: 'Orbitron', sans-serif;
    font-weight: 700;
    font-size: 0.72em;
    letter-spacing: 0.16em;
    cursor: pointer;
    transition: border-color 120ms, background 120ms, box-shadow 120ms;
  }
  .mobile-select-btn:active { transform: translateY(1px); }
  .mobile-select-btn:hover {
    border-color: var(--cyan);
    background: rgba(0,255,242,0.06);
  }
  .mobile-select-btn .check-box {
    width: 16px; height: 16px;
    border: 1.5px solid var(--cyan);
    background: transparent;
    position: relative;
    flex-shrink: 0;
  }
  .mobile-select-btn.is-on {
    border-color: var(--cyan);
    background: rgba(0,255,242,0.08);
    box-shadow: 0 0 12px rgba(0,255,242,0.25), inset 0 0 6px rgba(0,255,242,0.15);
  }
  .mobile-select-btn.is-on .check-box {
    background: var(--cyan);
  }
  .mobile-select-btn.is-on .check-box::after {
    content: '';
    position: absolute;
    left: 4px; top: 0px;
    width: 5px; height: 10px;
    border-right: 2px solid var(--bg);
    border-bottom: 2px solid var(--bg);
    transform: rotate(45deg);
  }
  .mobile-select-btn.is-indeterminate .check-box {
    background: rgba(0,255,242,0.35);
  }
  .mobile-select-btn.is-indeterminate .check-box::after {
    content: '';
    position: absolute;
    left: 2px; top: 6px;
    width: 10px; height: 2px;
    background: var(--bg);
  }

  /* Score filter group — operator + value behind a labeled hairline frame */
  .score-filter {
    display: inline-flex;
    align-items: stretch;
    border: 1px solid var(--border);
    background: var(--panel);
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .score-filter:focus-within {
    border-color: var(--cyan);
    box-shadow: 0 0 10px rgba(0,255,242,0.2);
  }
  .score-filter[data-active="true"] {
    border-color: var(--cyan);
    box-shadow: inset 0 0 8px rgba(0,255,242,0.12);
  }
  .score-filter .score-label {
    font-family: 'Orbitron', sans-serif;
    font-weight: 700;
    font-size: 0.7em;
    letter-spacing: 0.18em;
    color: var(--cyan);
    padding: 0 12px;
    display: inline-flex;
    align-items: center;
    background: rgba(0,255,242,0.06);
    border-right: 1px solid var(--border);
  }
  .controls .score-filter select {
    border: none;
    background: transparent;
    padding: 8px 10px;
    color: var(--cyan);
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.95em;
  }
  .controls .score-filter select:focus { box-shadow: none; }
  .controls .score-filter #filter-score-op {
    border-right: 1px solid var(--border);
    min-width: 70px;
    text-align: center;
    text-align-last: center;
  }
  .controls .score-filter #filter-score-value {
    min-width: 56px;
    text-align: center;
    text-align-last: center;
    transition: opacity 0.2s, color 0.2s;
  }
  .controls .score-filter #filter-score-value:disabled {
    opacity: 0.35;
    color: var(--border);
    cursor: not-allowed;
  }

  .controls select option {
    background: var(--bg);
  }

  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 2px;
    font-size: 0.75em;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .badge-accepted { background: rgba(57,255,20,0.15); color: var(--green); border: 1px solid rgba(57,255,20,0.3); }
  .badge-rejected { background: rgba(255,51,51,0.15); color: var(--red); border: 1px solid rgba(255,51,51,0.3); }
  .badge-starred { color: var(--amber); text-shadow: 0 0 8px var(--amber); }

  /* Table */
  .table-wrap {
    overflow-x: auto;
    border: 1px solid var(--border);
    background: var(--panel);
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.85em;
  }

  th {
    background: rgba(0,255,242,0.08);
    color: var(--cyan);
    text-align: left;
    padding: 10px 12px;
    font-weight: 400;
    letter-spacing: 1px;
    text-transform: uppercase;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
  }

  th:hover, th:active { background: rgba(0,255,242,0.12); }

  td {
    padding: 10px 12px;
    border-bottom: 1px solid rgba(0,255,242,0.08);
    vertical-align: top;
  }

  tr:hover td {
    background: rgba(0,255,242,0.04);
  }

  tr.expanded td {
    background: rgba(0,255,242,0.06);
  }

  .company { color: var(--cyan); font-weight: bold; }
  .company-link { cursor: pointer; }
  .company-link:hover { text-decoration: underline; }
  @keyframes cardGlow { 0%,100%{box-shadow:none} 50%{box-shadow:0 0 16px rgba(0,255,242,0.6)} }
  .card-highlight { animation: cardGlow 0.8s ease 2; }
  .position { color: var(--text); max-width: 350px; }
  .date { color: #666; white-space: nowrap; }
  .reason { color: var(--red); font-size: 0.8em; }
  .notes-cell { color: var(--amber); font-size: 0.85em; }

  /* Score styling */
  .score-cell {
    text-align: center;
    font-family: 'Orbitron', sans-serif;
    font-size: 1em;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.2s;
  }
  .score-cell:hover, .score-cell:active { transform: scale(1.2); }
  .score-high { color: var(--green); text-shadow: 0 0 10px rgba(57,255,20,0.5); }
  .score-mid { color: var(--amber); text-shadow: 0 0 10px rgba(255,191,0,0.5); }
  .score-low { color: var(--red); text-shadow: 0 0 10px rgba(255,51,51,0.5); }
  .score-none { color: #333; font-size: 0.8em; font-family: 'Share Tech Mono', monospace; cursor: default; }
  .score-none:hover { transform: none; }
  .badge-agentic { background: rgba(255,0,255,0.15); color: var(--magenta); border: 1px solid rgba(255,0,255,0.3); font-size: 0.7em; padding: 1px 6px; margin-left: 6px; letter-spacing: 1px; }

  .match-detail { padding: 12px 16px; background: rgba(0,255,242,0.04); border-bottom: 1px solid var(--border); font-size: 0.85em; line-height: 1.6; }
  .match-detail .match-summary { color: var(--cyan); margin-bottom: 8px; }
  .match-detail .match-label { color: #666; text-transform: uppercase; letter-spacing: 1px; font-size: 0.8em; margin-top: 8px; }
  .match-detail .match-list { color: var(--text); margin: 4px 0 0 16px; }
  .match-detail .match-list li { margin-bottom: 4px; }
  .match-reasons-list { color: var(--green); }
  .match-gaps-list { color: var(--red); }

  /* Star button */
  .star-btn {
    background: none;
    border: none;
    cursor: pointer;
    font-size: 1.2em;
    padding: 2px;
    transition: transform 0.2s;
  }
  .star-btn:hover, .star-btn:active { transform: scale(1.3); }

  /* Action buttons */
  .action-btn {
    font-family: 'Share Tech Mono', monospace;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 4px 10px;
    cursor: pointer;
    font-size: 0.75em;
    letter-spacing: 1px;
    transition: all 0.2s;
  }
  .action-btn:hover, .action-btn:active {
    border-color: var(--cyan);
    color: var(--cyan);
    box-shadow: 0 0 8px rgba(0,255,242,0.2);
  }
  .analyze-btn {
    font-family: 'Share Tech Mono', monospace; font-size: 0.72em;
    background: none; border: 1px solid #2a3a2a; color: #4a8a4a;
    padding: 2px 7px; cursor: pointer; letter-spacing: 0.5px;
  }
  .analyze-btn:hover:not(:disabled) { border-color: var(--green); color: var(--green); }
  .analyze-btn:disabled { color: #555; border-color: #222; cursor: default; }
  .analyze-result { font-size: 0.75em; color: #888; margin-left: 6px; }
  .analyze-result .score { color: var(--green); font-weight: bold; }
  .action-btn.danger:hover, .action-btn.danger:active {
    border-color: var(--red);
    color: var(--red);
    box-shadow: 0 0 8px rgba(255,51,51,0.2);
  }

  /* JD expand panel */
  .jd-panel {
    display: none;
    padding: 16px;
    background: rgba(0,0,0,0.3);
    border-top: 1px solid var(--border);
    font-size: 0.85em;
    line-height: 1.6;
    white-space: pre-wrap;
    max-height: 400px;
    overflow-y: auto;
    color: #999;
  }
  .jd-panel.open { display: block; }

  /* Sub-row: hidden on desktop, shown on mobile */
  .sub-row { display: none; }
  .sub-inner {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
  }
  .sub-date { color: #666; font-size: 0.85em; }

  /* Notes inline edit */
  .notes-input {
    font-family: 'Share Tech Mono', monospace;
    background: transparent;
    border: 1px solid transparent;
    border-bottom: 1px dashed #444;
    color: var(--amber);
    padding: 2px 4px;
    font-size: 0.85em;
    width: 100%;
    outline: none;
  }
  .notes-input:focus {
    border-color: var(--amber);
    box-shadow: 0 0 5px rgba(255,191,0,0.2);
  }

  /* Stats cards */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 16px;
    margin-bottom: 24px;
  }

  .stat-card {
    background: var(--panel);
    border: 1px solid var(--border);
    padding: 20px;
    text-align: center;
  }

  .stat-card .value {
    font-family: 'Orbitron', sans-serif;
    font-size: 2em;
    color: var(--cyan);
    text-shadow: 0 0 20px rgba(0,255,242,0.4);
  }

  .stat-card .label {
    color: #666;
    font-size: 0.8em;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-top: 8px;
  }

  .stat-card.green .value { color: var(--green); text-shadow: 0 0 20px rgba(57,255,20,0.4); }
  .stat-card.red .value { color: var(--red); text-shadow: 0 0 20px rgba(255,51,51,0.4); }
  .stat-card.amber .value { color: var(--amber); text-shadow: 0 0 20px rgba(255,191,0,0.4); }

  /* Stats lists */
  .stats-panel {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-top: 16px;
  }

  .stats-list {
    background: var(--panel);
    border: 1px solid var(--border);
    padding: 16px;
  }

  .stats-list h3 {
    font-family: 'Orbitron', sans-serif;
    font-size: 0.8em;
    color: var(--cyan);
    letter-spacing: 2px;
    margin-bottom: 12px;
    text-shadow: 0 0 10px rgba(0,255,242,0.3);
  }

  .stats-list .item {
    display: flex;
    justify-content: space-between;
    padding: 6px 0;
    border-bottom: 1px solid rgba(0,255,242,0.06);
  }

  .stats-list .item .name { color: var(--text); }
  .stats-list .item .count {
    color: var(--cyan);
    font-family: 'Orbitron', sans-serif;
    font-size: 0.9em;
  }

  /* Digest cards */
  .digest-card {
    background: var(--panel);
    border: 1px solid var(--border);
    margin-bottom: 8px;
  }

  .digest-header {
    padding: 12px 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
  }

  .digest-header:hover, .digest-header:active { background: rgba(0,255,242,0.04); }

  /* Read / unread visual: unread carries a cyan glow dot before the date
     and a yellow NEW pill; read cards drop the dot, fade the title down
     to dim text, and lower the whole card's opacity (rises on hover).
     Fits the green-screen terminal aesthetic. */
  .digest-unread-dot {
    display: inline-block;
    width: 8px; height: 8px;
    border-radius: 50%;
    margin-right: 10px;
    background: radial-gradient(circle at 35% 30%, #b9fff8, var(--cyan) 55%, transparent 75%);
    box-shadow: 0 0 8px rgba(0, 255, 242, 0.7), 0 0 16px rgba(0, 255, 242, 0.3);
    opacity: 0;
    transition: opacity 200ms ease;
  }
  .digest-card.is-unread .digest-unread-dot { opacity: 1; }
  .digest-card.is-read { opacity: 0.78; }
  .digest-card.is-read:hover { opacity: 1; }
  .digest-card.is-read .digest-date { color: var(--text-dim, #6a8); font-weight: 500; }
  .digest-unread-label {
    display: inline-block;
    margin-left: 12px;
    padding: 1px 8px;
    border: 1px solid var(--amber, #ffc94a);
    color: var(--amber, #ffc94a);
    font-family: 'Orbitron', sans-serif;
    font-size: 0.62em;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    background: rgba(255, 201, 74, 0.06);
    vertical-align: middle;
  }
  .digest-action-row {
    display: flex;
    justify-content: flex-end;
    padding: 8px 20px 0;
  }
  .digest-read-toggle {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--cyan);
    font-family: 'Orbitron', sans-serif;
    font-size: 0.62em;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    padding: 5px 12px;
    cursor: pointer;
    transition: border-color 160ms, color 160ms, background 160ms;
  }
  .digest-read-toggle:hover {
    border-color: var(--cyan);
    color: #fff;
    background: rgba(0, 255, 242, 0.08);
  }

  /* Back-to-top: cyan-bordered amber arrow, fixed bottom-right. Only
     present on the digests tab; fades in past 300px of window scroll. */
  .digest-top-btn {
    position: fixed;
    right: 24px;
    bottom: 28px;
    width: 44px; height: 44px;
    border: 1px solid var(--cyan);
    border-radius: 4px;
    background: rgba(0, 12, 16, 0.86);
    color: var(--amber, #ffc94a);
    font-family: 'Orbitron', sans-serif;
    font-size: 20px;
    font-weight: 700;
    line-height: 1;
    cursor: pointer;
    display: grid;
    place-items: center;
    z-index: 220;
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 220ms ease, transform 220ms ease, box-shadow 220ms ease;
    pointer-events: none;
    box-shadow: 0 0 12px rgba(0, 255, 242, 0.45), inset 0 0 0 1px rgba(0, 255, 242, 0.15);
  }
  .digest-top-btn.visible {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }
  .digest-top-btn:hover {
    box-shadow: 0 0 22px rgba(0, 255, 242, 0.7), inset 0 0 0 1px rgba(0, 255, 242, 0.3);
    color: #fff;
    transform: translateY(-2px);
  }
  .digest-top-btn:active { transform: translateY(0); }
  .digest-top-btn[hidden] { display: none !important; }

  .digest-date {
    color: var(--cyan);
    font-family: 'Orbitron', sans-serif;
    font-size: 0.9em;
  }

  .digest-content {
    padding: 16px 20px;
    background: rgba(0,0,0,0.3);
    border-top: 1px solid var(--border);
    font-size: 0.85em;
    line-height: 1.6;
    color: #bbb;
    max-height: 700px;
    overflow-y: auto;
  }
  .digest-content h1 { color: var(--cyan); font-family: 'Orbitron', sans-serif; font-size: 1.2em; margin: 16px 0 8px; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
  .digest-content h2 { color: var(--amber); font-size: 1.05em; margin: 18px 0 8px; }
  .digest-content h3 { color: var(--green); font-size: 0.95em; margin: 12px 0 6px; }
  .digest-content p { margin: 6px 0; }
  .digest-content strong { color: #ddd; }
  .digest-content a { color: var(--cyan); text-decoration: none; }
  .digest-content a:hover { text-decoration: underline; }
  .digest-content ul, .digest-content ol { margin: 6px 0 6px 20px; }
  .digest-content li { margin: 4px 0; }
  .digest-content hr { border: none; border-top: 1px solid var(--border); margin: 16px 0; }
  .digest-content blockquote { border-left: 3px solid var(--cyan); padding-left: 12px; color: #999; margin: 8px 0; }
  .digest-content code { background: rgba(0,255,242,0.08); padding: 2px 5px; border-radius: 3px; font-size: 0.9em; }
  .digest-content pre code { display: block; padding: 10px; overflow-x: auto; }

  /* Search runs */
  .run-card {
    background: var(--panel);
    border: 1px solid var(--border);
    padding: 12px 16px;
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .run-card .query { color: var(--cyan); }
  .run-card .meta { color: #666; font-size: 0.85em; }
  .run-card .nums span { margin-left: 12px; }
  .run-card .accepted { color: var(--green); }
  .run-card .rejected { color: var(--red); }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: var(--panel);
    border: 1px solid var(--cyan);
    color: var(--cyan);
    padding: 12px 20px;
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.85em;
    box-shadow: 0 0 20px rgba(0,255,242,0.3);
    z-index: 10000;
    opacity: 0;
    transition: opacity 0.3s;
  }
  .toast.show { opacity: 1; }

  /* Link styling */
  a {
    color: var(--magenta);
    text-decoration: none;
    transition: text-shadow 0.2s;
  }
  a:hover, a:active {
    text-shadow: 0 0 10px var(--magenta);
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); }
  ::-webkit-scrollbar-thumb:hover { background: var(--cyan); }

  /* Flicker animation for header */
  @keyframes flicker {
    0%, 100% { opacity: 1; }
    92% { opacity: 1; }
    93% { opacity: 0.8; }
    94% { opacity: 1; }
    96% { opacity: 0.9; }
    97% { opacity: 1; }
  }

  .header h1 { animation: flicker 4s infinite; }

  /* Bulk action bar — contextual, slides up from bottom when ≥1 selected */
  #bulk-bar {
    position: fixed;
    left: 50%;
    bottom: 24px;
    transform: translate(-50%, 140%);
    opacity: 0;
    pointer-events: none;
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 12px 22px;
    background: linear-gradient(180deg, rgba(13,13,26,0.96), rgba(8,8,18,0.98));
    border: 1px solid var(--cyan);
    box-shadow:
      0 0 0 1px rgba(0,255,242,0.15),
      0 8px 32px rgba(0,0,0,0.7),
      0 0 24px rgba(0,255,242,0.25),
      inset 0 1px 0 rgba(0,255,242,0.18);
    backdrop-filter: blur(6px);
    z-index: 1000;
    transition: transform 220ms cubic-bezier(0.2, 0.9, 0.2, 1.05), opacity 180ms ease-out;
    font-family: 'Share Tech Mono', monospace;
    color: var(--cyan);
    max-width: calc(100vw - 24px);
  }
  #bulk-bar.is-active {
    transform: translate(-50%, 0);
    opacity: 1;
    pointer-events: auto;
  }
  #bulk-bar::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--cyan), transparent);
    opacity: 0.7;
    animation: bulkScan 2.4s linear infinite;
  }
  @keyframes bulkScan {
    0% { transform: translateX(-30%); }
    100% { transform: translateX(30%); }
  }
  #bulk-bar .bulk-count {
    font-family: 'Orbitron', sans-serif;
    font-weight: 700;
    font-size: 0.78em;
    letter-spacing: 0.18em;
    color: var(--cyan);
    text-shadow: 0 0 6px rgba(0,255,242,0.55);
    white-space: nowrap;
  }
  #bulk-bar .bulk-count .num {
    display: inline-block;
    min-width: 1.6em;
    padding: 2px 6px;
    margin-right: 6px;
    background: rgba(0,255,242,0.08);
    border: 1px solid rgba(0,255,242,0.45);
    color: var(--cyan);
    text-align: center;
  }
  #bulk-bar .bulk-divider {
    width: 1px;
    height: 22px;
    background: linear-gradient(180deg, transparent, var(--border), transparent);
  }
  #bulk-bar .bulk-actions {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  #bulk-bar .btn-bulk {
    font-family: 'Orbitron', sans-serif;
    font-size: 0.72em;
    letter-spacing: 0.14em;
    font-weight: 700;
    padding: 8px 16px;
    border: 1px solid;
    background: transparent;
    cursor: pointer;
    transition: background 120ms, color 120ms, box-shadow 120ms, transform 80ms;
    text-transform: uppercase;
  }
  #bulk-bar .btn-bulk:active { transform: translateY(1px); }
  #bulk-bar .btn-clear {
    color: var(--text);
    border-color: var(--border);
  }
  #bulk-bar .btn-clear:hover {
    color: var(--cyan);
    border-color: var(--cyan);
    background: rgba(0,255,242,0.06);
  }
  #bulk-bar .btn-delete {
    color: var(--red);
    border-color: var(--red);
    box-shadow: 0 0 0 0 rgba(255,51,51,0);
  }
  #bulk-bar .btn-delete:hover {
    background: var(--red);
    color: #0a0a12;
    box-shadow: 0 0 18px rgba(255,51,51,0.55);
  }
  #bulk-bar .btn-delete.confirm {
    background: var(--red);
    color: #0a0a12;
    animation: bulkPulse 0.9s ease-in-out infinite;
  }
  @keyframes bulkPulse {
    0%, 100% { box-shadow: 0 0 12px rgba(255,51,51,0.4); }
    50%      { box-shadow: 0 0 24px rgba(255,51,51,0.85); }
  }
  @media (prefers-reduced-motion: reduce) {
    #bulk-bar { transition: opacity 120ms ease-out; transform: translate(-50%, 0); }
    #bulk-bar:not(.is-active) { opacity: 0; }
    #bulk-bar::before { animation: none; }
    #bulk-bar .btn-delete.confirm { animation: none; }
  }

  /* Responsive */
  @media (max-width: 768px) {
    /* Header: stack title + clock vertically */
    .header { padding: 12px 20px; flex-direction: column; align-items: flex-start; gap: 4px; }
    .header h1 { font-size: 1em; letter-spacing: 1px; }
    .header .clock { font-size: 0.8em; }

    .content { padding: 12px 20px; }
    .nav { flex-wrap: wrap; padding: 0 20px; }
    .nav button { padding: 10px 14px; font-size: 0.75em; }
    .stats-panel { grid-template-columns: 1fr; }

    /* Touch targets */
    .action-btn { padding: 8px 14px; min-height: 36px; }
    .star-btn { padding: 8px; font-size: 1.4em; }

    /* Controls: stack vertically, full width */
    .controls { flex-direction: column; gap: 8px; }
    .controls input, .controls select { width: 100%; box-sizing: border-box; }

    /* Run card: stack vertically */
    .run-card { flex-direction: column; gap: 8px; align-items: flex-start; }
    .run-card .nums { display: flex; flex-wrap: wrap; gap: 8px; }
    .run-card .nums span { margin-left: 0; }

    /* Break table layout model so CSS Grid can take over */
    .table-wrap table { display: block; }
    .table-wrap thead { display: none; }
    .table-wrap tbody { display: block; }

    /* Surface select-all on mobile (thead is hidden) */
    .mobile-select-bar {
      display: flex;
      justify-content: flex-start;
      margin-bottom: 12px;
    }
    .mobile-select-btn { width: 100%; justify-content: center; }

    /* Job row → CSS Grid: 5 columns, 2 rows */
    /* col1=CB(28px) col2=★(40px) col3=COMPANY+POSITION(flex) col4=SCORE(52px) col5=ACTIONS(90px) */
    .job-row {
      display: grid;
      grid-template-columns: 28px 40px 1fr 52px 90px;
      grid-template-rows: auto auto;
      border-bottom: none;
    }

    /* CHECKBOX — col1, spans both rows */
    .job-row > td:nth-child(1) {
      grid-column: 1; grid-row: 1 / 3;
      display: flex; align-items: center; justify-content: center;
    }
    /* ★ — col2, spans both rows */
    .job-row > td:nth-child(2) {
      grid-column: 2; grid-row: 1 / 3;
      display: flex; align-items: center; justify-content: center;
    }
    /* COMPANY — col3 row1 */
    .job-row > td:nth-child(3) {
      grid-column: 3; grid-row: 1;
      padding-bottom: 2px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    /* POSITION — col3 row2 (stacks under COMPANY, same column) */
    .job-row > td:nth-child(4) {
      grid-column: 3; grid-row: 2;
      padding-top: 2px; max-width: none;
      white-space: normal; overflow-wrap: anywhere;
    }
    /* SCORE — col4, spans both rows */
    .job-row > td:nth-child(5) {
      grid-column: 4; grid-row: 1 / 3;
      display: flex; align-items: center; justify-content: center;
    }
    /* STATUS / NOTES / DATE — hidden, don't participate in grid */
    .job-row > td:nth-child(6),
    .job-row > td:nth-child(7),
    .job-row > td:nth-child(8) { display: none; }
    /* ACTIONS — col5, spans both rows */
    .job-row > td:nth-child(9) {
      grid-column: 5; grid-row: 1 / 3;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 6px;
    }

    .job-row.row-selected { background: rgba(0,255,242,0.05); }

    /* Bulk action bar — full width on mobile, no centering transform */
    #bulk-bar { left: 12px; right: 12px; bottom: 12px; max-width: none; padding: 10px 14px; gap: 12px; transform: translate(0, 140%); }
    #bulk-bar.is-active { transform: translate(0, 0); }
    #bulk-bar .bulk-divider { display: none; }
    #bulk-bar .bulk-actions { gap: 8px; margin-left: auto; }
    #bulk-bar .btn-bulk { padding: 8px 12px; font-size: 0.7em; letter-spacing: 0.1em; }
    @media (prefers-reduced-motion: reduce) {
      #bulk-bar { transform: translate(0, 0); }
    }

    /* Sub-row, match-row, jd-row: block layout (colspan has no effect, td auto full-width) */
    .sub-row,
    [id^="match-row"],
    [id^="jd-row"] { display: block; }
    .sub-row > td,
    [id^="match-row"] > td,
    [id^="jd-row"] > td { display: block; }

    /* Sub-row: show with retro indent styling */
    .sub-row { display: block; }
    .sub-row > td {
      padding: 4px 12px 10px 52px;
      border-top: 1px dashed rgba(0,255,242,0.1);
      border-bottom: 1px solid rgba(0,255,242,0.08);
      background: rgba(0,0,0,0.2);
    }
    .sub-row .notes-input { margin-top: 4px; width: 100%; }
  }

  /* ── Company cards ───────────────────────────────────────────────────── */
  .companies-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 16px; padding: 16px;
  }
  .company-card {
    background: rgba(0,0,0,0.4); border: 1px solid var(--border);
    padding: 14px 16px; cursor: pointer; transition: border-color 0.15s;
  }
  .company-card:hover { border-color: var(--cyan); }
  .cc-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .cc-name { font-family: 'Orbitron', sans-serif; font-size: 0.82em; color: var(--cyan); letter-spacing: 0.05em; }
  .cc-overall { font-family: 'Orbitron', sans-serif; font-size: 1.4em; font-weight: 700;
    color: var(--green); text-shadow: 0 0 8px rgba(0,255,65,0.5); }
  .cc-overall.pending { color: #555; font-size: 0.8em; letter-spacing: 0.05em; }
  .cc-summary { font-size: 0.8em; color: #999; margin-bottom: 8px; min-height: 2.2em; }
  .cc-ats { font-size: 0.7em; color: #444; margin-bottom: 10px; }
  .cc-bars { display: flex; flex-direction: column; gap: 5px; }
  .cc-bar-row { display: flex; align-items: center; gap: 8px; font-size: 0.74em; }
  .cc-bar-label { width: 78px; color: #666; flex-shrink: 0; }
  .cc-bar-track { flex: 1; height: 6px; background: #111; border: 1px solid #222; }
  .cc-bar-fill { height: 100%; }
  .cc-bar-val { width: 18px; text-align: right; color: #777; }
  .cc-bar-fill.score-green { background: #00ff41; box-shadow: 0 0 4px rgba(0,255,65,0.4); }
  .cc-bar-fill.score-amber { background: #f0c040; box-shadow: 0 0 4px rgba(240,192,64,0.4); }
  .cc-bar-fill.score-red   { background: #ff4444; box-shadow: 0 0 4px rgba(255,68,68,0.4); }
  .cc-analyzed-at { font-size: 0.7em; color: #333; margin-top: 10px; }
  .badge-disabled { background: #1a1a1a; color: #444; padding: 1px 6px; font-size: 0.7em; border: 1px solid #333; }
  .cc-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; }
  .cc-jobs-btn {
    font-family: 'Share Tech Mono', monospace; font-size: 0.72em;
    background: none; border: 1px solid #2a2a2a; color: #555;
    padding: 3px 8px; cursor: pointer;
  }
  .cc-jobs-btn:hover { border-color: var(--cyan); color: var(--cyan); }
  .cc-reasoning {
    margin-top: 10px; border-top: 1px solid #1a1a1a; padding-top: 10px;
  }
  .cc-reason-row { display: flex; gap: 8px; margin-bottom: 6px; font-size: 0.78em; }
  .cc-reason-label { width: 78px; flex-shrink: 0; font-family: 'Share Tech Mono', monospace; }
  .cc-reason-label.funding { color: #00fff2; }
  .cc-reason-label.revenue { color: #00ff41; }
  .cc-reason-label.moat    { color: #f0c040; }
  .cc-reason-label.stage   { color: #a080ff; }
  .cc-reason-label.risk    { color: #ff4444; }
  .cc-reason-text { color: #999; line-height: 1.4; }
  .cc-expand-hint { font-size: 0.68em; color: #333; margin-top: 6px; text-align: center; }
  /* Financial profile */
  .cc-finance { margin: 8px 0 2px; padding-top: 7px; border-top: 1px solid #111; }
  .cc-cap-ptr-row { position: relative; height: 34px; overflow: visible; }
  .cc-cap-ptr { position: absolute; transform: translateX(-50%); text-align: center; bottom: 0; }
  .cc-cap-arrow { display: block; color: var(--cyan); font-size: 0.85em; line-height: 1; }
  .cc-cap-val { display: block; font-family: 'Orbitron', sans-serif; font-size: 0.6em; color: var(--cyan); white-space: nowrap; line-height: 1.3; }
  .cc-cap-axis { position: relative; height: 14px; border-top: 1px solid #555; margin-bottom: 2px; overflow: visible; }
  .cc-cap-tick { position: absolute; transform: translateX(-50%); font-family: 'Share Tech Mono', monospace; font-size: 0.58em; color: var(--cyan); top: 2px; white-space: nowrap; }
  .cc-tier-badge { display: inline-block; border: 1px solid; padding: 1px 5px; font-family: 'Share Tech Mono', monospace; font-size: 0.6em; margin-top: 2px; }
  .cc-stage-line { display: flex; align-items: center; flex-wrap: wrap; gap: 0; font-size: 0.78em; }
  .cc-stage-badge { border: 1px solid; padding: 1px 6px; font-family: 'Share Tech Mono', monospace; }
  .cc-raised { color: #aaa; }
  .cc-fin-sep { color: #333; margin: 0 6px; }
  .cc-investors { font-size: 0.72em; color: #555; margin-top: 3px; }
  #fab-jobs {
    position: fixed; bottom: 24px; right: 20px; z-index: 200;
    font-family: 'Share Tech Mono', monospace; font-size: 0.8em; letter-spacing: 0.08em;
    background: rgba(0,0,0,0.88); border: 1px solid var(--cyan); color: var(--cyan);
    padding: 10px 20px; cursor: pointer; display: none;
    box-shadow: 0 0 14px rgba(0,255,242,0.22);
  }
  #fab-jobs:hover  { background: rgba(0,255,242,0.07); box-shadow: 0 0 22px rgba(0,255,242,0.4); }
  #fab-score {
    position: fixed; bottom: 24px; right: 20px; z-index: 200;
    font-family: 'Share Tech Mono', monospace; font-size: 0.8em; letter-spacing: 0.08em;
    background: rgba(0,0,0,0.88); border: 1px solid var(--cyan); color: var(--cyan);
    padding: 10px 20px; cursor: pointer; display: none;
    box-shadow: 0 0 14px rgba(0,255,242,0.22);
  }
  #fab-score:hover { background: rgba(0,255,242,0.07); box-shadow: 0 0 22px rgba(0,255,242,0.4); }
  #fab-score.active { background: rgba(0,255,242,0.18); box-shadow: 0 0 24px rgba(0,255,242,0.6); color: #fff; }
  #tab-companies { padding-bottom: 64px; }
  #tab-jobs      { padding-bottom: 64px; }
</style>
</head>
<body>

<div class="header">
  <h1>🦀 JOB PIPELINE // TERMINAL v1.0</h1>
  <div class="clock" id="clock"></div>
</div>

<div class="nav">
  <button class="active" onclick="switchTab('jobs')">JOBS</button>
  <button onclick="switchTab('stats')">STATS</button>
  <button onclick="switchTab('runs')">SEARCH RUNS</button>
  <button onclick="switchTab('digests')">DIGESTS</button>
  <button onclick="switchTab('companies')">COMPANIES</button>
</div>

<div class="content">
  <!-- JOBS TAB -->
  <div id="tab-jobs">
    <div class="controls">
      <input type="text" id="search" placeholder="SEARCH COMPANY / POSITION..." style="width:280px;max-width:100%" oninput="debounceLoad()">
      <select id="filter-status" onchange="loadJobs()">
        <option value="">ALL STATUS</option>
        <option value="accepted">ACCEPTED</option>
        <option value="rejected">REJECTED</option>
        <option value="user_deleted">🗑 TRASH</option>
      </select>
      <select id="filter-starred" onchange="loadJobs()">
        <option value="">ALL</option>
        <option value="1">★ STARRED</option>
      </select>
      <select id="filter-days" onchange="loadJobs()">
        <option value="7">7 DAYS</option>
        <option value="14">14 DAYS</option>
        <option value="30" selected>30 DAYS</option>
        <option value="90">90 DAYS</option>
        <option value="365">ALL TIME</option>
      </select>
      <select id="filter-source" onchange="loadJobs()">
        <option value="">ALL SOURCES</option>
      </select>
      <span class="score-filter" data-active="false">
        <span class="score-label">SCORE</span>
        <select id="filter-score-op" onchange="onScoreFilterChange()" title="Score comparison operator">
          <option value="">ANY</option>
          <option value="ge">≥</option>
          <option value="le">≤</option>
          <option value="lt">&lt;</option>
          <option value="gt">&gt;</option>
          <option value="eq">=</option>
          <option value="null">UNSCORED</option>
        </select>
        <select id="filter-score-value" onchange="onScoreFilterChange()" title="Score threshold" disabled>
          <option value="0">0</option>
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4</option>
          <option value="5" selected>5</option>
          <option value="6">6</option>
          <option value="7">7</option>
          <option value="8">8</option>
          <option value="9">9</option>
          <option value="10">10</option>
        </select>
      </span>
    </div>

    <div class="mobile-select-bar" role="toolbar" aria-label="Bulk selection">
      <button type="button" id="select-all-mobile" class="mobile-select-btn" onclick="toggleSelectAllMobile()">
        <span class="check-box" aria-hidden="true"></span>
        <span class="check-label">SELECT ALL</span>
      </button>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th style="width:28px"><input type="checkbox" id="select-all" title="Select all" onchange="toggleSelectAll(this.checked)"></th>
            <th style="width:40px">★</th>
            <th onclick="sortBy('company')">COMPANY</th>
            <th onclick="sortBy('position')">POSITION</th>
            <th style="width:60px" onclick="sortBy('match_score')">SCORE</th>
            <th onclick="sortBy('status')">STATUS</th>
            <th>NOTES</th>
            <th onclick="sortBy('fetched_at')">DATE</th>
            <th style="width:100px">ACTIONS</th>
          </tr>
        </thead>
        <tbody id="jobs-body"></tbody>
      </table>
    </div>
    <div id="load-more-bar" style="display:none;text-align:center;padding:14px 0 6px">
      <button onclick="loadJobs(true)" style="font-family:'Share Tech Mono',monospace;background:none;border:1px solid #333;color:#555;padding:7px 28px;cursor:pointer;letter-spacing:0.05em">[ LOAD MORE ]</button>
    </div>
  </div>

  <!-- STATS TAB -->
  <div id="tab-stats" style="display:none">
    <div class="controls">
      <select id="stats-days" onchange="loadStats()">
        <option value="7">7 DAYS</option>
        <option value="14">14 DAYS</option>
        <option value="30" selected>30 DAYS</option>
        <option value="90">90 DAYS</option>
        <option value="365">ALL TIME</option>
      </select>
    </div>
    <div id="stats-content"></div>
  </div>

  <!-- SEARCH RUNS TAB -->
  <div id="tab-runs" style="display:none">
    <div class="controls">
      <select id="runs-days" onchange="loadRuns()">
        <option value="7">7 DAYS</option>
        <option value="30" selected>30 DAYS</option>
        <option value="90">90 DAYS</option>
      </select>
    </div>
    <div id="runs-content"></div>
  </div>

  <!-- DIGESTS TAB -->
  <div id="tab-digests" style="display:none">
    <div id="digests-content"></div>
  </div>

  <!-- Back-to-top: shown on digests tab only after the user scrolls
       past 300px. Fixed position so it survives any reflow. -->
  <button type="button" class="digest-top-btn" id="digest-top-btn" aria-label="back to top" hidden>↑</button>

  <!-- COMPANIES TAB -->
  <div id="tab-companies" style="display:none">
    <div class="controls">
      <input type="text" id="search-company" placeholder="SEARCH COMPANIES..." style="width:240px;max-width:100%" oninput="debounceCompanies()">
      <select id="filter-company-enabled" onchange="loadCompanies()">
        <option value="">ALL</option>
        <option value="1" selected>ENABLED</option>
        <option value="0">DISABLED</option>
      </select>
      <select id="filter-company-analyzed" onchange="loadCompanies()">
        <option value="">ALL</option>
        <option value="yes">ANALYZED</option>
        <option value="no">PENDING</option>
      </select>
    </div>
    <div id="companies-grid"></div>
  </div>
</div>

<div class="toast" id="toast"></div>
<button id="fab-jobs" onclick="switchTab('jobs')">→ JOBS</button>
<button id="fab-score" onclick="toggleScoreSort()">↓ TOP SCORE</button>

<script>
// ── State ──────────────────────────────────────────────────────────────
let currentSort = 'fetched_at';
let analyzedCompanies = new Set(); // companies with fresh analysis
const jobDetailCache = new Map();  // id → full job data (jd_text + match fields), for lazy expand
let jobsOffset = 0;
let jobsHasMore = false;
const JOBS_PAGE_SIZE = 100;
let currentOrder = 'desc';
let debounceTimer = null;
let currentJobs = [];          // jobs currently rendered (matches DOM)
let originalJobsSnapshot = null; // snapshot of currentJobs in API order, for un-sorting
let scoreSorted = false;       // top-score FAB active state
let loadJobsGen = 0;           // bump on each loadJobs; stale responses are dropped
let debounceCompanyTimer = null;
function debounceCompanies() {
  clearTimeout(debounceCompanyTimer);
  debounceCompanyTimer = setTimeout(loadCompanies, 200);
}

// ── Clock ──────────────────────────────────────────────────────────────
function updateClock() {
  const now = new Date();
  document.getElementById('clock').textContent =
    now.toLocaleString('en-US', { timeZone: 'America/Los_Angeles',
      year: 'numeric', month: '2-digit', day: '2-digit',
      hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false
    }) + ' PT';
}
setInterval(updateClock, 1000);
updateClock();

// ── Toast ──────────────────────────────────────────────────────────────
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

// ── Tabs ───────────────────────────────────────────────────────────────
function setFABs(tab) {
  document.getElementById('fab-jobs').style.display   = tab === 'companies' ? 'block' : 'none';
  document.getElementById('fab-score').style.display  = tab === 'jobs'      ? 'block' : 'none';
}

function switchTab(tab) {
  const tabLabels = {jobs:'JOBS', stats:'STATS', runs:'SEARCH RUNS', digests:'DIGESTS', companies:'COMPANIES'};
  document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.content > div').forEach(d => d.style.display = 'none');
  document.querySelectorAll('.nav button').forEach(b => { if (b.textContent === tabLabels[tab]) b.classList.add('active'); });
  document.getElementById('tab-' + tab).style.display = 'block';
  setFABs(tab);
  // The back-to-top button is digests-tab-only; gate it here so a tab
  // switch correctly hides it whether or not the user has scrolled.
  const topBtn = document.getElementById('digest-top-btn');
  if (topBtn) {
    if (tab === 'digests') {
      topBtn.hidden = false;
      updateDigestTopBtn();
    } else {
      topBtn.classList.remove('visible');
      topBtn.hidden = true;
    }
  }
  if (tab === 'stats') loadStats();
  if (tab === 'runs') loadRuns();
  if (tab === 'digests') loadDigests();
  if (tab === 'companies') loadCompanies();
}

function updateDigestTopBtn() {
  const btn = document.getElementById('digest-top-btn');
  if (!btn || btn.hidden) return;
  btn.classList.toggle('visible', window.scrollY > 300);
}
window.addEventListener('scroll', updateDigestTopBtn, { passive: true });
document.addEventListener('DOMContentLoaded', () => {
  const btn = document.getElementById('digest-top-btn');
  if (btn) btn.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
});

// ── Jobs ───────────────────────────────────────────────────────────────
function debounceLoad() {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(loadJobs, 300);
}

function sortBy(col) {
  if (currentSort === col) {
    currentOrder = currentOrder === 'desc' ? 'asc' : 'desc';
  } else {
    currentSort = col;
    currentOrder = col === 'fetched_at' ? 'desc' : 'asc';
  }
  loadJobs();
}

// Sort the currently-loaded jobs by match_score desc (client-side).
// Click again to restore the original API order. No network call.
function toggleScoreSort() {
  const fab = document.getElementById('fab-score');
  // Cancel any pending search-debounced loadJobs and invalidate any
  // in-flight loadJobs response — both would otherwise clobber the
  // sort we are about to apply.
  clearTimeout(debounceTimer);
  loadJobsGen++;
  if (!currentJobs.length) {
    toast('NO JOBS TO SORT');
    return;
  }
  let next;
  if (scoreSorted) {
    next = originalJobsSnapshot || currentJobs;
    scoreSorted = false;
    originalJobsSnapshot = null;
    fab.classList.remove('active');
  } else {
    originalJobsSnapshot = currentJobs.slice();
    next = currentJobs.slice().sort(
      (a, b) => (b.match_score ?? -1) - (a.match_score ?? -1)
    );
    scoreSorted = true;
    fab.classList.add('active');
  }
  renderJobs(next, /*append*/ false, /*fromServer*/ false);
}

async function loadJobs(append = false) {
  if (!append) jobsOffset = 0;
  const myGen = ++loadJobsGen;   // claim this call's generation
  const params = new URLSearchParams({
    days: document.getElementById('filter-days').value,
    sort: currentSort,
    order: currentOrder,
    limit: JOBS_PAGE_SIZE,
    offset: jobsOffset,
  });
  const status = document.getElementById('filter-status').value;
  const starred = document.getElementById('filter-starred').value;
  const search = document.getElementById('search').value;
  if (status) params.set('status', status);
  if (starred) params.set('starred', starred);
  if (search) params.set('search', search);
  const source = document.getElementById('filter-source').value;
  if (source) params.set('source', source);
  const scoreOp = document.getElementById('filter-score-op').value;
  const scoreValue = document.getElementById('filter-score-value').value;
  if (scoreOp === 'null') {
    params.set('score_op', 'null');
  } else if (scoreOp) {
    params.set('score_op', scoreOp);
    params.set('score_value', scoreValue);
  }

  const res = await fetch('/api/jobs?' + params);
  const data = await res.json();
  // Drop stale responses: a newer loadJobs / toggleScoreSort already won.
  if (myGen !== loadJobsGen) return;
  jobsHasMore = data.has_more;
  jobsOffset += data.jobs.length;
  renderJobs(data.jobs, append);
  document.getElementById('load-more-bar').style.display = jobsHasMore ? 'block' : 'none';
}

function scoreClass(s) {
  if (s == null) return 'score-none';
  if (s >= 7) return 'score-high';
  if (s >= 4) return 'score-mid';
  return 'score-low';
}

function renderMatchDetail(j) {
  if (j.match_score == null) return '';
  let html = '<div class="match-detail">';
  if (j.match_summary) html += `<div class="match-summary">${esc(j.match_summary)}</div>`;
  if (j.match_reasons) {
    const reasons = typeof j.match_reasons === 'string' ? JSON.parse(j.match_reasons) : j.match_reasons;
    if (reasons && reasons.length) {
      html += '<div class="match-label">MATCH REASONS</div><ul class="match-list match-reasons-list">';
      reasons.forEach(r => html += `<li>${esc(r)}</li>`);
      html += '</ul>';
    }
  }
  if (j.match_gaps) {
    const gaps = typeof j.match_gaps === 'string' ? JSON.parse(j.match_gaps) : j.match_gaps;
    if (gaps && gaps.length) {
      html += '<div class="match-label">GAPS</div><ul class="match-list match-gaps-list">';
      gaps.forEach(g => html += `<li>${esc(g)}</li>`);
      html += '</ul>';
    }
  }
  html += '</div>';
  return html;
}

function renderJobs(jobs, append = false, fromServer = true) {
  if (!append) { selectedIds.clear(); updateBulkBar(); }
  // Track currently-rendered jobs so the top-score FAB can sort client-side
  currentJobs = append ? currentJobs.concat(jobs) : jobs.slice();
  // A fresh server load resets the client-side sort state.
  // Re-renders triggered by client-side sort pass fromServer=false to keep it.
  if (!append && fromServer) {
    scoreSorted = false;
    originalJobsSnapshot = null;
    const fab = document.getElementById('fab-score');
    if (fab) fab.classList.remove('active');
  }
  // LOAD MORE while sort is active: extend the un-sorted snapshot (so toggle
  // off later restores ALL pages in API order) and re-render the full list
  // in score order — overrides the simple `insertAdjacentHTML` append below.
  if (append && fromServer && scoreSorted) {
    if (originalJobsSnapshot) originalJobsSnapshot.push(...jobs);
    currentJobs.sort((a, b) => (b.match_score ?? -1) - (a.match_score ?? -1));
    renderJobs(currentJobs, /*append*/ false, /*fromServer*/ false);
    return;
  }
  const tbody = document.getElementById('jobs-body');
  const html = jobs.map(j => `
    <tr class="job-row" id="row-${j.id}">
      <td>
        <input type="checkbox" class="job-cb" data-id="${j.id}"
               onchange="toggleSelect(${j.id}, this.checked)">
      </td>
      <td>
        <button class="star-btn" onclick="toggleStar(${j.id})">
          ${j.starred ? '<span class="badge-starred">★</span>' : '<span style="color:#333">☆</span>'}
        </button>
      </td>
      <td class="company"><a class="company-link" href="#" onclick="goToCompany('${esc(j.company)}');event.preventDefault();event.stopPropagation()">${esc(j.company)}</a></td>
      <td class="position">
        <a href="${esc(j.url)}" target="_blank">${esc(j.position)}</a>
        ${j.agentic_ai_relevant ? '<span class="badge-agentic">AGENTIC</span>' : ''}
      </td>
      <td class="score-cell ${scoreClass(j.match_score)}" onclick="${j.match_score != null ? `toggleMatch(${j.id})` : ''}">
        ${j.match_score != null ? j.match_score : '—'}
      </td>
      <td>
        <span class="badge badge-${j.status}">${j.status}</span>
        ${j.reject_reason ? '<br><span class="reason">' + esc(j.reject_reason) + '</span>' : ''}
      </td>
      <td class="notes-cell">
        <input class="notes-input" value="${esc(j.notes || '')}"
               placeholder="add note..."
               onblur="saveNotes(${j.id}, this.value)"
               onkeydown="if(event.key==='Enter')this.blur()">
      </td>
      <td class="date">${formatDate(j.fetched_at)}</td>
      <td>
        <div style="display:flex;flex-direction:column;gap:4px;align-items:flex-start">
          <button class="action-btn" onclick="toggleJD(${j.id})">JD</button>
          <button class="action-btn danger" onclick="deleteJob(${j.id})">DEL</button>
          <div id="analyze-area-${j.id}"><button class="analyze-btn" onclick="analyzeCompany(${j.id},this.dataset.c);event.stopPropagation()" data-c="${esc(j.company)}">${analyzedCompanies.has(j.company) ? '[REANALYZE]' : '[ANALYZE]'}</button></div>
        </div>
      </td>
    </tr>
    <tr class="sub-row" id="sub-${j.id}">
      <td colspan="9">
        <div class="sub-inner">
          <span class="badge badge-${j.status}">${j.status}</span>
          <span class="sub-date">${formatDate(j.fetched_at)}</span>
        </div>
        <input class="notes-input" value="${esc(j.notes || '')}"
               placeholder="add note..."
               onblur="saveNotes(${j.id}, this.value)"
               onkeydown="if(event.key==='Enter')this.blur()">
      </td>
    </tr>
    <tr id="match-row-${j.id}" style="display:none">
      <td colspan="9"></td>
    </tr>
    <tr id="jd-row-${j.id}" style="display:none">
      <td colspan="9"></td>
    </tr>
  `).join('');
  if (append) tbody.insertAdjacentHTML('beforeend', html);
  else tbody.innerHTML = html;
}

async function saveNotes(id, notes) {
  await fetch(`/api/jobs/${id}`, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ notes })
  });
  toast('NOTES SAVED');

async function analyzeCompany(jobId, company) {
  const area = document.getElementById('analyze-area-' + jobId);
  if (!area) return;
  area.innerHTML = `<button class="analyze-btn" disabled>[ANALYZING...]</button>`;
  try {
    const res = await fetch(`/api/companies/${encodeURIComponent(company)}/analyze`, {
      method: 'POST', signal: AbortSignal.timeout(120000)
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || res.statusText);
    analyzedCompanies.add(company);
    const model = (data.analyst_model || '').replace('claude-', '').replace('-4-', ' 4.');
    const cached = data.cached ? ' (cached)' : '';
    area.innerHTML = `<span class="analyze-result">
      score: <span class="score">${data.overall_score}</span>/10
      <button class="analyze-btn" style="margin-left:6px" onclick="goToCompany('${esc(company)}');event.stopPropagation()">[VIEW]</button>
      <span style="color:#444;font-size:0.9em"> ${model}${cached}</span>
    </span>`;
    toast(`${company}: score ${data.overall_score}/10`);
  } catch(e) {
    area.innerHTML = `<button class="analyze-btn" onclick="analyzeCompany(${jobId},'${esc(company)}')">[ANALYZE]</button>`;
    toast('ANALYZE ERROR: ' + e.message);
  }
}


function deleteJob(id) {
  const row = document.getElementById('row-' + id);
  if (!row) return;
  const btn = row.querySelector('.action-btn.danger');
  if (btn.dataset.confirm === 'yes') {
    // Second click — actually delete
    fetch(`/api/jobs/${id}`, { method: 'DELETE' }).then(() => {
      toast('DELETED');
      loadJobs();
    });
  } else {
    // First click — ask for confirmation
    btn.dataset.confirm = 'yes';
    btn.textContent = 'SURE?';
    btn.style.borderColor = 'var(--red)';
    btn.style.color = 'var(--red)';
    btn.style.boxShadow = '0 0 8px rgba(255,51,51,0.3)';
    setTimeout(() => {
      btn.dataset.confirm = '';
      btn.textContent = 'DEL';
      btn.style.borderColor = '';
      btn.style.color = '';
      btn.style.boxShadow = '';
    }, 3000);
  }
}

  if (jobDetailCache.has(id)) return jobDetailCache.get(id);
  const detail = await fetch(`/api/jobs/${id}`).then(r => r.json());
  jobDetailCache.set(id, detail);
  return detail;
}

  if (row.style.display !== 'none') { row.style.display = 'none'; return; }

async function toggleJD(id) {
  const row = document.getElementById('jd-row-' + id);

function esc(s) {
  if (!s) return '';
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function formatDate(dt) {
  if (!dt) return '';
  const d = new Date(dt + 'Z');
  return d.toLocaleDateString('en-US', { timeZone: 'America/Los_Angeles', month: 'short', day: 'numeric' })
    + ' ' + d.toLocaleTimeString('en-US', { timeZone: 'America/Los_Angeles', hour: '2-digit', minute: '2-digit', hour12: false });
}

        <span class="digest-date">${formatDate(s.date)}</span>
        <span class="digest-meta" style="color:#666;font-size:0.8em;margin-left:12px">

        </span>
        ${s.is_read ? '' : '<span class="digest-unread-label">NEW</span>'}

function toggleDigest(id) {
  const body = document.getElementById('body-' + id);
  const toggle = document.getElementById('toggle-' + id);
  const card = document.getElementById('digest-' + id);
  if (body.style.display === 'none') {
    body.style.display = 'block';
    toggle.textContent = '[-]';
    // Auto-mark read when the accordion expands. If already read, no-op.
    if (card && card.dataset.isRead !== '1') {
      markDigestReadState(id, true);
    }
  } else {
    body.style.display = 'none';
    toggle.textContent = '[+]';
  }
}

function toggleDigestRead(id) {
  const card = document.getElementById('digest-' + id);
  if (!card) return;
  const isRead = card.dataset.isRead === '1';
  markDigestReadState(id, !isRead);
}

async function markDigestReadState(id, isRead) {
  // Optimistic UI: flip card class + button label first, then POST.
  const card = document.getElementById('digest-' + id);
  if (card) {
    card.classList.toggle('is-read', isRead);
    card.classList.toggle('is-unread', !isRead);
    card.dataset.isRead = isRead ? '1' : '0';
    const label = card.querySelector('.digest-unread-label');
    if (isRead && label) label.remove();
    else if (!isRead && !label) {
      const meta = card.querySelector('.digest-meta');
      if (meta) meta.insertAdjacentHTML('afterend', '<span class="digest-unread-label">NEW</span>');
    }
    const btn = card.querySelector('.digest-read-toggle');
    if (btn) btn.textContent = isRead ? 'MARK UNREAD' : 'MARK READ';
  }
  try {
    await fetch(`/api/summaries/${id}/${isRead ? 'read' : 'unread'}`, { method: 'POST' });
  } catch (e) { /* swallow; reload will resync */ }
}

async function loadCompanies() {
  const res = await fetch('/api/companies');

  const enabledFilter = document.getElementById('filter-company-enabled').value;
  const analyzedFilter = document.getElementById('filter-company-analyzed').value;
  const searchQ = (document.getElementById('search-company').value || '').trim().toLowerCase();
  if (enabledFilter !== '') companies = companies.filter(c => String(c.enabled) === enabledFilter);
  if (analyzedFilter === 'yes') companies = companies.filter(c => c.overall_score != null);
  if (analyzedFilter === 'no')  companies = companies.filter(c => c.overall_score == null);
  if (searchQ) companies = companies.filter(c =>
    (c.company || '').toLowerCase().includes(searchQ) ||
    (c.summary  || '').toLowerCase().includes(searchQ) ||
    (c.ats_type || '').toLowerCase().includes(searchQ)

    return;
  }

  grid.className = 'companies-grid';
  grid.innerHTML = companies.map((c, i) => {
    const analyzed = c.overall_score != null;
    const cardId = 'cc-' + i;
    const scoreHtml = analyzed
      ? `<div class="cc-overall">${c.overall_score}</div>`
      : `<div class="cc-overall pending">PENDING</div>`;

    const barsHtml = analyzed
      ? `<div class="cc-bars">
          ${bar('资金安全垫', c.funding_score, false)}
          ${bar('收入确定性', c.revenue_score, false)}
          ${bar('竞争壁垒',   c.moat_score,    false)}
          ${bar('阶段规模',   c.stage_score,   false)}
          ${bar('结构风险↓',  c.risk_score,    true)}
        </div>`
      : '<div style="color:#444;font-size:0.8em;padding:8px 0">No analysis yet — run company-analyze skill</div>';

    let reasoningHtml = '';
    if (analyzed && c.reasoning) {
      let r = {};
      try { r = typeof c.reasoning === 'string' ? JSON.parse(c.reasoning) : c.reasoning; } catch(e) {}
      reasoningHtml = `<div class="cc-reasoning" id="cr-${cardId}" style="display:none">
        ${c.summary ? `<div style="font-size:0.82em;color:#bbb;margin-bottom:8px">${esc(c.summary)}</div>` : ''}
        ${r.funding ? `<div class="cc-reason-row"><span class="cc-reason-label funding">资金安全垫</span><span class="cc-reason-text">${esc(r.funding)}</span></div>` : ''}
        ${r.revenue ? `<div class="cc-reason-row"><span class="cc-reason-label revenue">收入确定性</span><span class="cc-reason-text">${esc(r.revenue)}</span></div>` : ''}
        ${r.moat    ? `<div class="cc-reason-row"><span class="cc-reason-label moat">竞争壁垒</span><span class="cc-reason-text">${esc(r.moat)}</span></div>` : ''}
        ${r.stage   ? `<div class="cc-reason-row"><span class="cc-reason-label stage">阶段规模</span><span class="cc-reason-text">${esc(r.stage)}</span></div>` : ''}
        ${r.risk    ? `<div class="cc-reason-row"><span class="cc-reason-label risk">结构风险</span><span class="cc-reason-text">${esc(r.risk)}</span></div>` : ''}
      </div>`;
    }

    const disabledBadge = !c.enabled ? ' <span class="badge-disabled">DISABLED</span>' : '';
    const expandHint = analyzed ? `<div class="cc-expand-hint" id="hint-${cardId}">[click to expand]</div>` : '';
    const financeHtml = analyzed ? buildFinanceHtml(c) : '';

    return `<div class="company-card" id="${cardId}" data-company="${esc(c.company)}" onclick="toggleCompanyCard('${cardId}', event)">
      <div class="cc-header">
        <div class="cc-name">${esc(c.company)}${disabledBadge}</div>
        ${scoreHtml}
      </div>
      <div class="cc-summary">${esc(c.summary || '')}</div>
      <div class="cc-ats">${c.ats_type}${c.ats_slug ? ' / ' + esc(c.ats_slug) : ''}</div>
      ${barsHtml}
      ${financeHtml}
      ${reasoningHtml}
      ${expandHint}
      <div class="cc-footer">
        <span class="cc-analyzed-at">${c.analyzed_at ? 'analyzed ' + formatDate(c.analyzed_at) : ''}</span>
        <button class="cc-jobs-btn" onclick="event.stopPropagation(); filterByCompany('${esc(c.company)}')">→ JOBS</button>
      </div>
    </div>`;
  }).join('');
}

function getScoreColor(score, isRisk) {
  if (score == null) return 'score-amber';
  const s = isRisk ? (11 - score) : score; // invert risk so high-risk → red
  if (s >= 8) return 'score-green';
  if (s >= 5) return 'score-amber';
  return 'score-red';
}

function bar(label, val, isRisk) {
  const v = val ?? 0;
  const pct = (v / 10 * 100).toFixed(0);
  const cls = getScoreColor(val, isRisk);
  return `<div class="cc-bar-row">
    <div class="cc-bar-label">${label}</div>
    <div class="cc-bar-track"><div class="cc-bar-fill ${cls}" style="width:${pct}%"></div></div>
    <div class="cc-bar-val">${val ?? '—'}</div>
  </div>`;
}

function buildFinanceHtml(c) {
  if (c.is_public === 1 && c.market_cap_usd != null) {
    const cap = c.market_cap_usd;
    // log10 scale: $1B (cap=1) → 0%, $10B → 33%, $100B → 67%, $1T (cap=1000) → 100%
    const pct = Math.min(95, Math.max(2, Math.log10(Math.max(0.1, cap)) / 3 * 100)).toFixed(1);
    const capStr = cap >= 1000 ? `$${(cap/1000).toFixed(1)}T`
                 : cap >= 1   ? `$${Math.round(cap)}B`
                 : `$${(cap*1000).toFixed(0)}M`;
    const [tierLabel, tierColor] =
      cap >= 200 ? ['MEGA-CAP',  '#9b5de5'] :
      cap >= 10  ? ['LARGE-CAP', '#00ff41'] :
      cap >= 2   ? ['MID-CAP',   '#f0c040'] :
                   ['SMALL-CAP', '#555555'];
    return `<div class="cc-finance">
      <div class="cc-cap-ptr-row">
        <div class="cc-cap-ptr" style="left:${pct}%">
          <span class="cc-cap-arrow">▼</span>
          <span class="cc-cap-val">${capStr}</span>
        </div>
      </div>
      <div class="cc-cap-axis">
        <span class="cc-cap-tick" style="left:0%">$1B</span>
        <span class="cc-cap-tick" style="left:33.3%">$10B</span>
        <span class="cc-cap-tick" style="left:66.7%">$100B</span>
        <span class="cc-cap-tick" style="left:100%">$1T</span>
      </div>
      <span class="cc-tier-badge" style="color:${tierColor};border-color:${tierColor}">${tierLabel}</span>
    </div>`;
  } else if (c.is_public === 0) {
    const parts = [];
    const stageColor =
      /seed/i.test(c.funding_stage||'')      ? '#4499ff' :
      /\bA\b|\bB\b/.test(c.funding_stage||'') ? '#00ff41' :
      /\bC\b|\bD\b/.test(c.funding_stage||'') ? '#f0c040' :
      /pre.?ipo/i.test(c.funding_stage||'')   ? '#ffd700' :
      /[EFG]|growth/i.test(c.funding_stage||'') ? '#a080ff' : '#888888';
    if (c.funding_stage)
      parts.push(`<span class="cc-stage-badge" style="color:${stageColor};border-color:${stageColor}">${esc(c.funding_stage)}</span>`);
    if (c.total_raised_usd != null) {
      const raised = c.total_raised_usd >= 1000
        ? `$${(c.total_raised_usd/1000).toFixed(1)}B raised`
        : `$${Math.round(c.total_raised_usd)}M raised`;
      parts.push(`<span class="cc-raised">${raised}</span>`);
    }
    if (!parts.length) return '';
    let investorsHtml = '';
    try {
      const inv = typeof c.notable_investors === 'string'
        ? JSON.parse(c.notable_investors || 'null') : c.notable_investors;
      if (Array.isArray(inv) && inv.length) {
        const shown = inv.slice(0, 3).map(esc).join(' · ');
        const extra = inv.length > 3 ? ` <span style="color:#333">+${inv.length-3} more</span>` : '';
        investorsHtml = `<div class="cc-investors">${shown}${extra}</div>`;
      }
    } catch(e) {}
    return `<div class="cc-finance">
      <div class="cc-stage-line">${parts.join('<span class="cc-fin-sep"> • </span>')}</div>
      ${investorsHtml}
    </div>`;
  }
  return '';
}

function toggleCompanyCard(cardId, event) {
  const detail = document.getElementById('cr-' + cardId);
  const hint = document.getElementById('hint-' + cardId);
  const card = document.getElementById(cardId);
  if (!detail) return;
  const open = detail.style.display !== 'none';
  detail.style.display = open ? 'none' : 'block';
  if (hint) hint.textContent = open ? '[click to expand]' : '[click to collapse]';
  if (card) card.style.borderColor = open ? '' : 'var(--cyan)';
}

async function goToCompany(name) {
  // If no analysis yet, stay on jobs tab and guide the user to the ANALYZE button
  if (!analyzedCompanies.has(name)) {
    toast(`No analysis for ${name} yet — click [ANALYZE] on this row to start`);
    return;
  }

  // Switch to COMPANIES tab
  document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.nav button').forEach(b => { if (b.textContent === 'COMPANIES') b.classList.add('active'); });
  document.querySelectorAll('.content > div').forEach(d => d.style.display = 'none');
  document.getElementById('tab-companies').style.display = 'block';
  setFABs('companies');

  // Clear search so the target card is never filtered out
  document.getElementById('search-company').value = '';
  await loadCompanies();

  const card = document.querySelector(`.company-card[data-company="${name.replace(/"/g, '\\"')}"]`);
  if (!card) return;

  // Scroll and highlight
  card.scrollIntoView({ behavior: 'smooth', block: 'center' });
  card.classList.remove('card-highlight');
  void card.offsetWidth;
  card.classList.add('card-highlight');
  setTimeout(() => card.classList.remove('card-highlight'), 1800);

  // Auto-expand reasoning if analyzed
  const cardId = card.id;
  const detail = document.getElementById('cr-' + cardId);
  if (detail && detail.style.display === 'none') {
    toggleCompanyCard(cardId, { target: card });
  }
}

function filterByCompany(company) {
  // Switch to jobs tab and filter by company name
  document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.nav button').forEach(b => {
    if (b.textContent === 'JOBS') b.classList.add('active');
  });
  document.querySelectorAll('.content > div').forEach(d => d.style.display = 'none');
  document.getElementById('tab-jobs').style.display = 'block';
  setFABs('jobs');
  document.getElementById('search').value = company;
  loadJobs();
}

// ── Init ───────────────────────────────────────────────────────────────
function onScoreFilterChange() {
  const op = document.getElementById('filter-score-op').value;
  const valSel = document.getElementById('filter-score-value');
  const wrap = document.querySelector('.score-filter');
  // Value is meaningful only for numeric comparisons; UNSCORED + ANY hide it.
  const numericOp = op && op !== 'null';
  valSel.disabled = !numericOp;
  if (wrap) wrap.dataset.active = op ? 'true' : 'false';
  // Persist to URL so reload restores filter state.
  const url = new URL(window.location);
  if (op === 'null') {
    url.searchParams.set('score_op', 'null');
    url.searchParams.delete('score_value');
  } else if (op) {
    url.searchParams.set('score_op', op);
    url.searchParams.set('score_value', valSel.value);
  } else {
    url.searchParams.delete('score_op');
    url.searchParams.delete('score_value');
  }
  window.history.replaceState({}, '', url);
  loadJobs();
}

function _restoreScoreFilterFromURL() {
  const sp = new URLSearchParams(window.location.search);
  const op = sp.get('score_op');
  const val = sp.get('score_value');
  if (!op) return;
  const opSel = document.getElementById('filter-score-op');
  const valSel = document.getElementById('filter-score-value');
  if (Array.from(opSel.options).some(o => o.value === op)) {
    opSel.value = op;
  }
  if (val && Array.from(valSel.options).some(o => o.value === val)) {
    valSel.value = val;
  }
  const numericOp = op && op !== 'null';
  valSel.disabled = !numericOp;
  document.querySelector('.score-filter').dataset.active = 'true';
}

async function init() {
  _restoreScoreFilterFromURL();
  try {
    const data = await fetch('/api/sources').then(r => r.json());
    const sel = document.getElementById('filter-source');
    (data.sources || []).forEach(s => {
      const opt = document.createElement('option');
      opt.value = s;
      opt.textContent = s.toUpperCase();
      sel.appendChild(opt);
    });
  } catch (e) { /* keep ALL SOURCES only fallback */ }
  try {
    const ca = await fetch('/api/companies').then(r => r.json());
    (ca.companies || []).forEach(c => { if (c.overall_score != null) analyzedCompanies.add(c.company); });
  } catch (e) {}
  setFABs('jobs');
  loadJobs();
}

// ── Bulk select + delete ──────────────────────────────────────────────────
let selectedIds = new Set();
let bulkConfirmTimer = null;

function toggleSelect(id, checked) {
  if (checked) selectedIds.add(id);
  else selectedIds.delete(id);
  document.getElementById('row-' + id)?.classList.toggle('row-selected', checked);
  updateBulkBar();
  updateSelectAllCb();
}

function toggleSelectAll(checked) {
  document.querySelectorAll('.job-cb').forEach(cb => {
    cb.checked = checked;
    const id = parseInt(cb.dataset.id);
    if (checked) selectedIds.add(id);
    else selectedIds.delete(id);
    document.getElementById('row-' + id)?.classList.toggle('row-selected', checked);
  });
  updateBulkBar();
  updateSelectAllCb();
}

function toggleSelectAllMobile() {
  // Treat the mobile button as a toggle: any selection → deselect all,
  // none selected → select all visible.
  const cbs = [...document.querySelectorAll('.job-cb')];
  if (!cbs.length) return;
  const allChecked = cbs.every(c => c.checked);
  toggleSelectAll(!allChecked);
}

function updateSelectAllCb() {
  const cbs = [...document.querySelectorAll('.job-cb')];
  const sel = document.getElementById('select-all');
  const mobileBtn = document.getElementById('select-all-mobile');
  if (!cbs.length) {
    if (sel) { sel.checked = false; sel.indeterminate = false; }
    if (mobileBtn) {
      mobileBtn.classList.remove('is-on', 'is-indeterminate');
      mobileBtn.querySelector('.check-label').textContent = 'SELECT ALL';
      mobileBtn.setAttribute('aria-pressed', 'false');
    }
    return;
  }
  const nChecked = cbs.filter(c => c.checked).length;
  if (sel) {
    sel.checked = nChecked === cbs.length;
    sel.indeterminate = nChecked > 0 && nChecked < cbs.length;
  }
  if (mobileBtn) {
    const allOn = nChecked === cbs.length;
    const partial = nChecked > 0 && nChecked < cbs.length;
    mobileBtn.classList.toggle('is-on', allOn);
    mobileBtn.classList.toggle('is-indeterminate', partial);
    const label = mobileBtn.querySelector('.check-label');
    if (allOn) label.textContent = 'DESELECT ALL';
    else if (partial) label.textContent = `SELECT ALL (${nChecked})`;
    else label.textContent = 'SELECT ALL';
    mobileBtn.setAttribute('aria-pressed', allOn ? 'true' : 'false');
  }
}

function updateBulkBar() {
  const n = selectedIds.size;
  const bar = document.getElementById('bulk-bar');
  if (!bar) return;
  bar.classList.toggle('is-active', n > 0);
  const numEl = document.getElementById('bulk-count-num');
  if (numEl) numEl.textContent = String(n).padStart(2, '0');
  if (n === 0 && bulkConfirmTimer) {
    clearTimeout(bulkConfirmTimer); bulkConfirmTimer = null;
    const btn = document.getElementById('bulk-del-btn');
    if (btn) {
      btn.textContent = 'DELETE';
      btn.dataset.confirm = '';
      btn.classList.remove('confirm');
    }
  }
}

function bulkDeleteClick() {
  const btn = document.getElementById('bulk-del-btn');
  if (btn.dataset.confirm === 'yes') {
    clearTimeout(bulkConfirmTimer); bulkConfirmTimer = null;
    bulkDeleteExec();
  } else {
    btn.dataset.confirm = 'yes';
    btn.textContent = 'CONFIRM DELETE ' + selectedIds.size;
    btn.classList.add('confirm');
    bulkConfirmTimer = setTimeout(() => {
      btn.dataset.confirm = '';
      btn.textContent = 'DELETE';
      btn.classList.remove('confirm');
    }, 3000);
  }
}

function bulkClearSelection() {
  selectedIds.forEach(id => {
    document.getElementById('row-' + id)?.classList.remove('row-selected');
    const cb = document.querySelector('.job-cb[data-id="' + id + '"]');
    if (cb) cb.checked = false;
  });
  selectedIds.clear();
  updateBulkBar();
  updateSelectAllCb();
}

async function bulkDeleteExec() {
  const ids = [...selectedIds];
  try {
    const res = await fetch('/api/jobs/bulk-delete', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ids })
    });
    const data = await res.json();
    toast('DELETED ' + data.updated + ' JOBS');
  } catch(e) { toast('ERROR: ' + e.message); return; }
  selectedIds.clear();
  updateBulkBar();
  // Hard reload after bulk delete so the page shows a clean state.
  // The current querystring (filter/search) is preserved by default, so the
  // user lands back in the same view minus the deleted rows.
  window.location.reload();
}

init();
</script>

<div id="bulk-bar" role="region" aria-label="Bulk actions">
  <span class="bulk-count"><span class="num" id="bulk-count-num">00</span>SELECTED</span>
  <span class="bulk-divider"></span>
  <span class="bulk-actions">
    <button class="btn-bulk btn-clear" onclick="bulkClearSelection()">CLEAR</button>
    <button id="bulk-del-btn" class="btn-bulk btn-delete" onclick="bulkDeleteClick()">DELETE</button>
  </span>
</div>
</body>
</html>
